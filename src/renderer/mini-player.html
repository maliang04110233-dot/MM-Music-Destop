<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http: https:; media-src 'self' data: blob: file: http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws:;">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; height: 80px;
      background: linear-gradient(135deg, #0d1120 0%, #1a1a2e 100%);
      color: #e8e6ff;
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      -webkit-app-region: drag;
      overflow: hidden;
      user-select: none;
    }
    .mini-cover {
      width: 52px; height: 52px; border-radius: 8px;
      background: #1c2135;
      object-fit: cover;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      transition: transform 0.3s;
    }
    .mini-cover.playing {
      animation: mini-disc-spin 8s linear infinite;
    }
    @keyframes mini-disc-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .mini-cover-ph {
      width: 52px; height: 52px; border-radius: 8px;
      background: #1c2135;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .mini-info {
      flex: 1; min-width: 80px; max-width: 120px;
      -webkit-app-region: no-drag;
    }
    .mini-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #e8e6ff;
    }
    .mini-artist {
      font-size: 11px; color: #8b89a8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .mini-lyric {
      font-size: 10px; color: #00ffc8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 3px;
      opacity: 0.8;
    }
    .mini-controls {
      display: flex; gap: 4px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .mini-btn {
      width: 32px; height: 32px; border-radius: 6px; border: none;
      background: transparent; color: #e8e6ff;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .mini-btn:hover { background: rgba(255,255,255,0.08); }
    .mini-btn.play { color: #00ffc8; }
    .mini-progress {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: #1c2135;
    }
    .mini-progress-fill {
      height: 100%; background: linear-gradient(90deg, #00ffc8, #a78bfa);
      width: 0%; transition: width 0.3s;
    }
    .mini-time {
      position: absolute; bottom: 6px; right: 50px;
      font-size: 10px; color: #4a4869;
      -webkit-app-region: no-drag;
    }
    .mini-close {
      position: absolute; top: 2px; right: 4px;
      width: 18px; height: 18px; border-radius: 4px; border: none;
      background: transparent; color: #4a4869;
      font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-app-region: no-drag;
    }
    .mini-close:hover { color: #f87171; background: rgba(255,0,0,0.1); }
  </style>
</head>
<body>
  <img class="mini-cover" id="miniCover" style="display:none" src="" alt="专辑封面">
  <div class="mini-cover-ph" id="miniCoverPh">🎵</div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle" data-i18n="player.playing">未在播放</div>
    <div class="mini-artist" id="miniArtist" data-i18n="player.artist">—</div>
    <div class="mini-lyric" id="miniLyric"></div>
  </div>
  <div class="mini-controls">
    <button class="mini-btn" onclick="send('mini-prev')" title="上一首">⏮</button>
    <button class="mini-btn play" id="miniPlayBtn" onclick="send('mini-toggle-play')" title="播放/暂停">▶</button>
    <button class="mini-btn" onclick="send('mini-next')" title="下一首">⏭</button>
  </div>
  <span class="mini-time" id="miniTime">0:00 / 0:00</span>
  <button class="mini-close" onclick="send('mini-close')" title="关闭">✕</button>
  <div class="mini-progress">
    <div class="mini-progress-fill" id="miniProgressFill"></div>
  </div>

  <script>
    // C3 fix: use contextBridge preload API instead of require('electron')
    function send(channel) { window.miniAPI.send(channel); }

    window.miniAPI.on('mini-player-update', (data) => {
      const title = document.getElementById('miniTitle');
      const artist = document.getElementById('miniArtist');
      const cover = document.getElementById('miniCover');
      const coverPh = document.getElementById('miniCoverPh');
      const playBtn = document.getElementById('miniPlayBtn');
      const progress = document.getElementById('miniProgressFill');
      const lyric = document.getElementById('miniLyric');
      const timeEl = document.getElementById('miniTime');

      if (data.title) title.textContent = data.title;
      if (data.artist !== undefined) artist.textContent = data.artist || '未知艺术家';
      if (data.cover) {
        cover.src = data.cover;
        cover.style.display = 'block';
        coverPh.style.display = 'none';
        cover.classList.toggle('playing', data.playing);
      } else {
        cover.style.display = 'none';
        coverPh.style.display = 'flex';
        cover.classList.remove('playing');
      }
      playBtn.textContent = data.playing ? '⏸' : '▶';
      if (typeof data.progress === 'number') {
        progress.style.width = data.progress + '%';
      }
      if (data.lyric) {
        lyric.textContent = data.lyric;
        lyric.style.display = 'block';
      } else {
        lyric.style.display = 'none';
      }
      if (data.time) {
        timeEl.textContent = data.time;
      }
    });
  </script>
</body>
</html>
