<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>桌面歌词</title>
  <!-- 复用主窗口令牌；注意下方必须覆盖 base.css 的 html,body 背景，否则透明窗变不透明 -->
  <link rel="stylesheet" href="./styles/base.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; }
    body {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 歌词主区：拖动区（未锁定时）+ 穿透（锁定后正文不响应鼠标） */
    .lyric-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: var(--sp-2);
      padding: 0 var(--sp-5);
      -webkit-app-region: drag;
    }
    /* 主字用纯白 + 双层暗描边：桌面歌词浮在任意壁纸上，可读性优先于主题一致性 */
    .lyric-line {
      max-width: 100%;
      font-size: 28px;
      font-weight: var(--fw-bold);
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      transition: opacity var(--dur-3) var(--ease), transform var(--dur-3) var(--ease);
    }
    .lyric-line.prev,
    .lyric-line.next { opacity: .45; font-size: 22px; font-weight: var(--fw-med); }
    .lyric-line.empty::before { content: '♪ 暂无歌词 ♪'; font-size: 18px; font-weight: var(--fw-normal); opacity: .6; }
    /* 逐字卡拉 OK 高亮（强调色走令牌，换主题即换色） */
    .lyric-line .w { color: rgba(255,255,255,.5); transition: color var(--dur-2) var(--ease); }
    .lyric-line .w.lit { color: var(--accent-ui); text-shadow: 0 1px 6px var(--accent-line); }
    .lyric-sub {
      max-width: 100%;
      font-size: 16px;
      font-weight: var(--fw-med);
      color: rgba(255,255,255,.55);
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 悬停控制条（锁定时隐藏拖动提示，控制条始终可点） */
    .control-bar {
      display: none;
      justify-content: flex-end;
      gap: var(--sp-1);
      padding: var(--sp-1) var(--sp-2);
      -webkit-app-region: no-drag;
    }
    body:hover .control-bar { display: flex; }
    .dl-btn {
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: color-mix(in srgb, var(--bg-deep) 84%, transparent);
      border: 1px solid var(--stroke-2);
      border-radius: var(--r-sm);
      color: var(--fg-1);
      font-family: inherit;
      font-size: var(--fs-xs);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
    }
    .dl-btn:hover { background: var(--elev-2); color: var(--fg-1); border-color: var(--stroke-2); }
    .dl-btn.active { color: var(--accent-ui); border-color: var(--accent-line); }
  </style>
</head>
<body>
  <div class="lyric-stage" id="lyricStage">
    <div class="lyric-line prev" id="lyricPrev"></div>
    <div class="lyric-line" id="lyricCur"></div>
    <div class="lyric-line next" id="lyricNext"></div>
    <div class="lyric-sub" id="lyricSub"></div>
  </div>
  <div class="control-bar" id="controlBar">
    <button class="dl-btn" id="btnLock" title="锁定歌词（锁定后正文鼠标穿透，仅控制条可点）" aria-label="锁定或解锁歌词">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-1"/></svg>
    </button>
    <button class="dl-btn" id="btnFontDown" title="缩小字号" aria-label="缩小字号">A-</button>
    <button class="dl-btn" id="btnFontUp" title="放大字号" aria-label="放大字号">A+</button>
    <button class="dl-btn" id="btnClose" title="关闭桌面歌词" aria-label="关闭桌面歌词">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <script>
    // ── 状态 ─────────────────────────────────────────────
    let lyrics = [];        // [{t, text, subText, words:[], wordTimes:[]}]
    let currentTime = 0;
    let curIdx = -1;       // 当前行索引
    let locked = false;     // 锁定 = 正文穿透
    let fontSize = 28;     // 主行字号（持久化由主窗口 prefs 代理，本地兜底 localStorage 不可用时用内存）
    try { fontSize = +localStorage.getItem('dlFont') || 28; } catch (e) { /* transparent 窗口有时禁存储 */ }

    const elPrev = document.getElementById('lyricPrev');
    const elCur  = document.getElementById('lyricCur');
    const elNext = document.getElementById('lyricNext');
    const elSub  = document.getElementById('lyricSub');

    function applyFontSize() {
      elCur.style.fontSize = fontSize + 'px';
      elPrev.style.fontSize = Math.max(14, Math.round(fontSize * 0.78)) + 'px';
      elNext.style.fontSize = Math.max(14, Math.round(fontSize * 0.78)) + 'px';
      elSub.style.fontSize = Math.max(12, Math.round(fontSize * 0.55)) + 'px';
      try { localStorage.setItem('dlFont', String(fontSize)); } catch (e) { /* ignore */ }
    }

    // ── 渲染 ─────────────────────────────────────────────
    function renderLines() {
      if (!lyrics.length) {
        elCur.classList.add('empty');
        elCur.textContent = '';
        elPrev.textContent = '';
        elNext.textContent = '';
        elSub.textContent = '';
        elSub.style.display = 'none';
        return;
      }
      elCur.classList.remove('empty');
      elSub.style.display = '';

      const p = lyrics[curIdx - 1];
      const c = lyrics[curIdx] || lyrics[0];
      const n = lyrics[curIdx + 1];

      elPrev.textContent = p ? p.text : '';
      elNext.textContent = n ? n.text : '';
      elSub.textContent = c && c.subText ? c.subText : '';

      // 当前行：逐字 span（卡拉 OK）
      if (c && c.words && c.words.length) {
        elCur.innerHTML = c.words.map((w, j) =>
          `<span class="w" data-j="${j}">${w === ' ' ? '&nbsp;' : w}</span>`
        ).join('');
      } else {
        elCur.textContent = c ? c.text : '';
      }
      highlightWords();
    }

    // 按 currentTime 点亮已唱过的字
    function highlightWords() {
      const c = lyrics[curIdx];
      if (!c) return;
      const spans = elCur.querySelectorAll('.w');
      for (let j = 0; j < spans.length; j++) {
        const wt = c.wordTimes && c.wordTimes[j];
        if (wt !== undefined && currentTime + 1e-6 >= wt) spans[j].classList.add('lit');
        else spans[j].classList.remove('lit');
      }
    }

    // 定位当前行（二分查找第一个 t > currentTime 的行）
    function locate() {
      if (!lyrics.length) { if (curIdx !== -1) { curIdx = -1; renderLines(); } return; }
      let lo = 0, hi = lyrics.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (lyrics[mid].t <= currentTime) lo = mid + 1;
        else hi = mid;
      }
      const idx = lo - 1;
      if (idx !== curIdx) {
        curIdx = idx;
        renderLines();
      } else {
        highlightWords();
      }
    }

    // ── 数据接收 ─────────────────────────────────────────
    window.miniAPI.on('desktop-lyric-data', (data) => {
      if (!data) return;
      if (data.lyrics) {
        // 整份歌词（换歌时推送；含 wordTimes 供逐字高亮）
        lyrics = Array.isArray(data.lyrics) ? data.lyrics : [];
        curIdx = -2; // 强制重渲染
      }
      if (typeof data.currentTime === 'number') currentTime = data.currentTime;
      if (typeof data.fontSize === 'number' && data.fontSize > 0 && data.fontSize !== fontSize) {
        fontSize = data.fontSize;
        applyFontSize();
      }
      locate();
    });

    // ── 控制条 ───────────────────────────────────────────
    const ICON_UNLOCKED = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-1"/></svg>';
    const ICON_LOCKED = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

    function setLocked(v) {
      locked = !!v;
      const btn = document.getElementById('btnLock');
      btn.innerHTML = locked ? ICON_LOCKED : ICON_UNLOCKED;
      btn.title = locked ? '解锁歌词（当前正文鼠标穿透）' : '锁定歌词（锁定后正文鼠标穿透，仅控制条可点）';
      btn.classList.toggle('active', locked);
      // 锁定：整窗穿透（控制条靠 mouseenter 恢复）；解锁：恢复点击
      window.miniAPI.send('desktop-lyric-lock', locked);
    }

    document.getElementById('btnLock').addEventListener('click', () => setLocked(!locked));
    document.getElementById('btnClose').addEventListener('click', () => window.miniAPI.send('desktop-lyric-close'));
    document.getElementById('btnFontUp').addEventListener('click', () => { fontSize = Math.min(52, fontSize + 2); applyFontSize(); });
    document.getElementById('btnFontDown').addEventListener('click', () => { fontSize = Math.max(16, fontSize - 2); applyFontSize(); });

    // 穿透模式：正文区域忽略鼠标（hover 控制条时恢复点击）
    // body:hover .control-bar 显示；但锁定后窗口 ignoreMouseEvents(true) 会导致
    // body 永远不 hover —— 用 forward:true 让事件继续转发进来，mouseenter 仍能触发
    document.getElementById('controlBar').addEventListener('mouseenter', () => {
      window.miniAPI.send('desktop-lyric-set-ignore-mouse', false);
    });
    document.getElementById('controlBar').addEventListener('mouseleave', () => {
      if (locked) window.miniAPI.send('desktop-lyric-set-ignore-mouse', true);
    });

    applyFontSize();
    renderLines();
  </script>
</body>
</html>
